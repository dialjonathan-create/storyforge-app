<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="night" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#2a3e6a"/>
      <stop offset="0.55" stop-color="#152240"/>
      <stop offset="1" stop-color="#0a1120"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="298" x2="0" y2="736" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d3b70"/>
      <stop offset="0.4" stop-color="#6a60a0"/>
      <stop offset="0.74" stop-color="#f2a874"/>
      <stop offset="1" stop-color="#fff0c8"/>
    </linearGradient>
    <linearGradient id="farHills" x1="0" y1="700" x2="0" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b48aa6"/><stop offset="1" stop-color="#7a6494"/>
    </linearGradient>
    <linearGradient id="nearHills" x1="0" y1="740" x2="0" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4b4278"/><stop offset="1" stop-color="#29254c"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="752" x2="0" y2="846" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd896"/><stop offset="1" stop-color="#fff7e2"/>
    </linearGradient>
    <linearGradient id="goldO" x1="0" y1="260" x2="0" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9e2a4"/><stop offset="0.45" stop-color="#d9a54a"/><stop offset="1" stop-color="#8d5f1b"/>
    </linearGradient>
    <linearGradient id="goldI" x1="0" y1="260" x2="0" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff1c6"/><stop offset="0.5" stop-color="#ecc06a"/><stop offset="1" stop-color="#b0802c"/>
    </linearGradient>
    <linearGradient id="leaf" x1="648" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16243f"/><stop offset="1" stop-color="#2d4576"/>
    </linearGradient>
    <radialGradient id="spill" cx="476" cy="846" r="1" gradientTransform="translate(476 846) scale(360 150) translate(-476 -846)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe3a0" stop-opacity=".8"/><stop offset="1" stop-color="#ffe3a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="490" cy="560" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1c26f" stop-opacity=".4"/><stop offset=".6" stop-color="#f1c26f" stop-opacity=".07"/><stop offset="1" stop-color="#f1c26f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starglow" cx="524" cy="440" r="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6dc" stop-opacity=".95"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowBlur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="open"><path d="M304 846 V470 A172 172 0 0 1 648 470 V846 Z"/></clipPath>
  </defs>
    <!-- Maskable variant: the scene scaled to 80% so the arch, door and star sit inside the
       40%-radius safe circle any platform mask leaves. -->
  <rect width="1024" height="1024" fill="url(#night)"/>
  <rect width="1024" height="1024" fill="url(#halo)"/>
  <g transform="translate(512 512) scale(.8) translate(-512 -575)">
  <g fill="#f6e3b4">
    <circle cx="170" cy="196" r="4.5" opacity=".55"/><circle cx="846" cy="168" r="3.5" opacity=".45"/>
    <circle cx="896" cy="420" r="3.5" opacity=".35"/><circle cx="128" cy="500" r="3.5" opacity=".3"/>
    <circle cx="240" cy="300" r="2.5" opacity=".35"/><circle cx="760" cy="226" r="3" opacity=".4"/>
    <circle cx="880" cy="640" r="2.5" opacity=".25"/>
  </g>
  <ellipse cx="476" cy="846" rx="360" ry="150" fill="url(#spill)"/>
  <!-- the other world -->
  <g clip-path="url(#open)">
    <rect x="290" y="290" width="370" height="560" fill="url(#sky)"/>
    <g fill="#fff4d8"><circle cx="384" cy="400" r="3.2"/><circle cx="594" cy="530" r="2.5" opacity=".8"/><circle cx="420" cy="560" r="2" opacity=".6"/><circle cx="580" cy="360" r="2.2" opacity=".75"/><circle cx="350" cy="500" r="1.8" opacity=".6"/></g>
    <circle cx="524" cy="440" r="78" fill="url(#starglow)"/>
    <path d="M524 388 Q528 436 576 440 Q528 444 524 492 Q520 444 472 440 Q520 436 524 388Z" fill="#fffaf0"/>
    <path d="M290 738 C340 714 400 712 446 726 C500 704 580 700 660 728 V850 H290 Z" fill="url(#farHills)"/>
    <path d="M290 770 C360 748 420 752 476 766 C540 750 600 748 660 760 V850 H290 Z" fill="url(#nearHills)"/>
    <!-- road: one path in, two paths out -->
    <path d="M418 850 C450 820 470 800 474 784 C470 776 446 770 404 766 L406 762 C446 764 470 768 478 774 C488 766 520 760 562 756 L564 760 C528 766 496 774 486 786 C486 804 510 826 540 850 Z" fill="url(#road)"/>
  </g>
  <!-- door leaf, swung open toward us -->
  <path d="M648 846 L776 888 L880 884 C840 868 750 850 648 846Z" fill="#050a14" opacity=".4" filter="url(#shadowBlur)"/>
  <path d="M648 470 C664 384 702 330 764 296 L776 888 L648 846 Z" fill="url(#leaf)"/>
  <path d="M674 480 C686 418 712 382 746 360 L749 560 L674 560 Z" fill="#0f1a31" opacity=".55"/>
  <path d="M674 600 L750 604 L754 816 L674 796 Z" fill="#0f1a31" opacity=".55"/>
  <path d="M674 480 C686 418 712 382 746 360 L749 560 L674 560 Z M674 600 L750 604 L754 816 L674 796 Z" fill="none" stroke="#e7bb66" stroke-width="4.5" stroke-linejoin="round" opacity=".6"/>
  <path d="M764 296 L776 888" stroke="#f6d690" stroke-width="6" opacity=".7"/>
  <path d="M648 470 C664 384 702 330 764 296" fill="none" stroke="#f6d690" stroke-width="4" opacity=".45"/>
  <circle cx="736" cy="582" r="10" fill="url(#goldI)"/>
  <!-- frame -->
  <path d="M304 846 V470 A172 172 0 0 1 648 470 V846" fill="none" stroke="url(#goldO)" stroke-width="40"/>
  <path d="M304 846 V470 A172 172 0 0 1 648 470 V846" fill="none" stroke="url(#goldI)" stroke-width="12" opacity=".9"/>
  <rect x="262" y="838" width="428" height="28" rx="10" fill="url(#goldO)"/>
  <rect x="270" y="841" width="412" height="6" rx="3" fill="#fff0c4" opacity=".7"/>
  </g>
</svg>
