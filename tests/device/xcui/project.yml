name: ComposerDeviceCheck
options:
  bundleIdPrefix: dev.storyforge.check
  deploymentTarget:
    iOS: "17.0"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Host
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
      TEST_TARGET_NAME: Host
